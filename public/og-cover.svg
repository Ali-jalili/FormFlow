<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle grid dots -->
  <g fill="#ffffff" opacity="0.05">
    <g>
      <circle cx="100" cy="520" r="1.5"/><circle cx="140" cy="520" r="1.5"/><circle cx="180" cy="520" r="1.5"/>
      <circle cx="220" cy="520" r="1.5"/><circle cx="260" cy="520" r="1.5"/><circle cx="300" cy="520" r="1.5"/>
    </g>
  </g>

  <!-- Logo + wordmark (top-left) -->
  <g transform="translate(90 78)">
    <rect width="52" height="52" rx="14" fill="url(#accent)"/>
    <g transform="translate(14 14)" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" fill="none">
      <rect x="0" y="2" width="24" height="16" rx="3"/>
      <line x1="5" y1="9" x2="19" y2="9"/>
      <line x1="5" y1="14" x2="13" y2="14"/>
    </g>
    <text x="70" y="37" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">FormFlow</text>
  </g>

  <!-- Product mock card (right) -->
  <g transform="translate(720 150)">
    <rect width="360" height="360" rx="20" fill="#0b1220" stroke="#1e293b" stroke-width="1"/>
    <!-- browser bar -->
    <rect x="20" y="20" width="320" height="34" rx="8" fill="#0f172a"/>
    <circle cx="40" cy="37" r="5" fill="#fb7185"/>
    <circle cx="58" cy="37" r="5" fill="#fbbf24"/>
    <circle cx="76" cy="37" r="5" fill="#34d399"/>
    <!-- field rows -->
    <g transform="translate(20 78)">
      <rect width="320" height="70" rx="12" fill="#111c30" stroke="#1e293b"/>
      <rect x="16" y="16" width="140" height="12" rx="6" fill="#64748b"/>
      <rect x="16" y="38" width="220" height="14" rx="7" fill="#1e293b"/>
    </g>
    <g transform="translate(20 168)">
      <rect width="320" height="94" rx="12" fill="#111c30" stroke="#312e81" stroke-opacity="0.6"/>
      <rect x="16" y="16" width="170" height="12" rx="6" fill="#64748b"/>
      <circle cx="34" cy="56" r="8" fill="url(#accent)"/>
      <rect x="52" y="50" width="150" height="12" rx="6" fill="#334155"/>
    </g>
    <!-- submit -->
    <g transform="translate(20 284)">
      <rect width="150" height="34" rx="10" fill="url(#accent)"/>
      <text x="75" y="22" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Submit</text>
    </g>
  </g>

  <!-- Headline (left) -->
  <text x="90" y="250" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Build, share,</text>
  <text x="90" y="330" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
    <tspan fill="#ffffff">and</tspan>
    <tspan fill="url(#accent)"> collect.</tspan>
  </text>

  <text x="92" y="392" font-family="Arial,sans-serif" font-size="24" fill="#cbd5e1">A visual form builder with stable</text>
  <text x="92" y="424" font-family="Arial,sans-serif" font-size="24" fill="#cbd5e1">public links and a protected database.</text>

  <!-- Bottom-left pill: Deployed on Vercel -->
  <g transform="translate(90 490)">
    <rect width="210" height="44" rx="22" fill="#0b1220" stroke="#1e293b"/>
    <circle cx="26" cy="22" r="6" fill="#34d399"/>
    <text x="46" y="28" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">Deployed on Vercel</text>
  </g>

  <!-- Bottom-right tags -->
  <text x="1110" y="512" text-anchor="end" font-family="Arial,sans-serif" font-size="16" fill="#64748b">React · Supabase · Row Level Security</text>
</svg>
